<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predictions</title>
<meta name="description" content="Predictions: a two-player number game on a 5×5 board.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Serif+Text:ital@0;1&family=Libre+Franklin:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Predictions</h1>
    <div class="acts">
      <button class="ib" id="new" aria-label="New game" title="New game (undo brings the old one back)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main class="game">
    <section class="score" id="score" aria-label="Score">
      <div class="tally">
        <div class="pts R" id="ptsR">0</div>
        <div class="bar" id="bar" aria-hidden="true"></div>
        <div class="pts B" id="ptsB">0</div>
      </div>
      <div class="labels"><span class="R">RED</span><span class="turn" id="turn" aria-live="polite"></span><span class="B">BLUE</span></div>
    </section>

    <div class="board" id="board" aria-label="Board"></div>
    <div id="panel"></div>
  </main>
</div>

<noscript><p style="text-align:center;font-family:Georgia,serif">Predictions needs JavaScript to run.</p></noscript>
<script src="engine.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
